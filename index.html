<!DOCTYPE html>
<html>

<head>
    <title>FCM Token Generator</title>
</head>

<body>

    <h2>Firebase Token Generator</h2>

    <button onclick="generateToken()">
        Generate Token
    </button>

    <br><br>

    <textarea id="token"
              rows="12"
              cols="90"></textarea>

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getMessaging,
            getToken
        }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-messaging.js";


        const firebaseConfig = {
                apiKey: "AIzaSyA5cPnc1rYo-Mg0J_kR46UsVcU17opuHsc",
                authDomain: "smarttransithub-aaf9a.firebaseapp.com",
                projectId: "smarttransithub-aaf9a",
                storageBucket: "smarttransithub-aaf9a.firebasestorage.app",
                messagingSenderId: "648916569463",
                appId: "1:648916569463:web:92a2d846a000f9561c6572"
            };

        const app = initializeApp(firebaseConfig);

        const messaging = getMessaging(app);

        window.generateToken = async function () {

            try {

                const permission =
                    await Notification.requestPermission();

                if (permission !== "granted") {

                    alert("Permission denied");

                    return;

                }

                const token = await getToken(messaging, {

                    vapidKey: "BJsWWJYM0u5lM93gDDtuMMgXWLcE-zpPS7xbs3eSoxars-rVfXXx72y0sGpoEnjBHYmI3FQTh3AsbVEqaib0wYw"

                });

                document.getElementById("token").value = token;

                console.log(token);

            }

            catch (e) {

                console.error(e);

                alert(e.message);

            }

        }

    </script>

</body>

</html>
